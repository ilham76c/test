
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_development_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
      - vendor_data:/var/www/html/vendor
      - build_data:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: test_development_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_APP_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

volumes:
  mysql_data:
  vendor_data:
  build_data:

networks:
  app_network:
    driver: bridge
